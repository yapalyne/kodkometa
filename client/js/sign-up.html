<!DOCTYPE html>
<html lang="ru">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta charset="utf-8" />
  <title>Регистрация</title>
  <link rel="stylesheet" href="../css/common.css" />
  <link rel="stylesheet" href="../css/sign-up.css"/>
</head>
<body>

<div class="desktop desktop--fluid">

  <div class="card">
    <div class="title">РЕГИСТРАЦИЯ</div>

    <!-- ОБЕРНИТЕ ВСЁ В FORM -->
    <form id="registerForm">
      <div class="form">
        <div class="row">
          <label>логин</label>
          <input type="text" name="username" required>
        </div>

        <div class="row">
          <label>email</label>
          <input type="email" name="email" required>
        </div>

        <div class="row">
          <label>пароль</label>
          <input type="password" name="password" required>
        </div>
      </div>
      <button type="submit" class="arrow">&rarr;</button>
    </form>
  </div>

  <div class="logo">КОДКОМЕТА</div>

</div>

<script>

const form =
  document.getElementById(
    'registerForm'
  );

form.addEventListener(
  'submit',
  async (e) => {

    e.preventDefault();

    const username =
      document.querySelector(
        'input[name="username"]'
      ).value;

    const email =
      document.querySelector(
        'input[name="email"]'
      ).value;

    const password =
      document.querySelector(
        'input[name="password"]'
      ).value;

    try {

      const response =
        await fetch(
         '/auth/register',
          {
            method: 'POST',

            headers: {
              'Content-Type':
                'application/json'
            },

            body: JSON.stringify({

              username,
              email,
              password

            })

          }
        );

      const data =
        await response.json();

      console.log(data);

      localStorage.setItem(
        'userId',
        data.user.id
      );

      localStorage.setItem(
        'username',
        data.user.username
      );

      alert(
        'Регистрация успешна!'
      );

      window.location.href =
        'kurs.html';

    }

    catch(error) {

      console.log(error);

      alert(
        'Ошибка регистрации'
      );

    }

  }
);

</script>

</body>
</html>
