<script>

async function loadAccount() {

  const userId = localStorage.getItem('userId');

  try {

const courses = [

  'html',
  'css',
  'js',
  'ts',
  'react',
  'vue',
  'angular'

];

const responses = await Promise.all(

  courses.map(course =>

    fetch(
      `https://kodkometa-yapalyne.amvera.io/progress/${userId}/${course}`
    )
      .then(res => res.json())

  )

);

const progress =
  responses.flat();


    // сколько тем пройдено
    const completedCount = progress.filter(
      topic => topic.completed
    ).length;

    console.log('Пройдено тем:', completedCount);

    const totalTopics =
  progress.length;

const overallPercent =
  totalTopics > 0
    ? Math.round(
        (
          completedCount /
          totalTopics
        ) * 100
      )
    : 0;

console.log(
  'Общий прогресс:',
  overallPercent + '%'
);

const overallFill =
  document.getElementById(
    'overall-progress-fill'
  );

overallFill.style.width =
  overallPercent + '%';

  const overallText =
  document.getElementById(
    'overall-progress-text'
  );

overallText.textContent =
  overallPercent + '%';

    // элементы
    const stageText = document.getElementById(
      'evolution-stage'
    );

    const characterImage = document.getElementById(
      'character-image'
    );

    const daysLabel =
  document.getElementById(
    'days-count'
  );

// проверяем активность
const lastActivity =
  localStorage.getItem('lastActivity');

const now = new Date().getTime();

const sevenDays =
  7 * 24 * 60 * 60 * 1000;

// первая активность
const firstActivity =
  localStorage.getItem(
    'firstActivity'
  );

if (!firstActivity) {

  localStorage.setItem(
    'firstActivity',
    now
  );

}

// считаем дни
const savedFirstActivity =
  localStorage.getItem(
    'firstActivity'
  );

const activeDays =
  savedFirstActivity
    ? Math.floor(
        (
          now -
          Number(savedFirstActivity)
        ) / (
          1000 * 60 * 60 * 24
        )
      )
    : 0;

// выводим дни
const days =
  activeDays + 1;

let daysText = '';

if (
  days % 10 === 1 &&
  days % 100 !== 11
) {

  daysText = 'день';

}

else if (
  [2, 3, 4].includes(days % 10) &&
  ![12, 13, 14].includes(days % 100)
) {

  daysText = 'дня';

}

else {

  daysText = 'дней';

}

daysLabel.textContent =
  days + ' ' + daysText;

// чёрная дыра
if (
  lastActivity &&
  now - Number(lastActivity) > sevenDays
) {

  stageText.textContent =
    'чёрная дыра';

  characterImage.querySelector('source').src =
  '../images/avatar/blackhole.mp4';

  characterImage.load();

  return;

}

  console.log(daysLabel);

    // стадии эволюции
if (overallPercent <= 10) {

  stageText.textContent =
    'звёздная пыль';

characterImage.querySelector('source').src =
  '../images/avatar/dust.mp4';

characterImage.load();

}

else if (overallPercent <= 30) {

  stageText.textContent =
    'протозвезда';

characterImage.querySelector('source').src =
  '../images/avatar/proto.mp4';

characterImage.load();

}

else if (overallPercent <= 60) {

  stageText.textContent =
    'звезда';

characterImage.querySelector('source').src =
  '../images/avatar/star.mp4';

characterImage.load();

}

else if (overallPercent <= 90) {

  stageText.textContent =
    'красный гигант';

characterImage.querySelector('source').src =
  '../images/avatar/giant.mp4';

characterImage.load();

}

else {

  stageText.textContent =
    'сверхновая';

characterImage.querySelector('source').src =
  '../images/avatar/blackhole.mp4';

characterImage.load();

}

  } catch(error) {

    console.log(
      'Ошибка загрузки аккаунта:',
      error
    );

  }

}

loadAccount();

</script>

    };

  }

  const total = progress.length;

  const passed = progress.filter(
    item => item.completed
  ).length;

  const percent =
    total > 0
      ? Math.round((passed / total) * 100)
      : 0;

  const tests = progress.map((item, index) => ({

    name: getTopicName(jsTopics, item, index),

    status:
      item.completed
        ? 'Пройдено'
        : 'Не пройдено',

    score: `${(item.score || 0) * 20}%`

  }));

  return {

    title: 'JS',

    summary:
      `Пройдено ${passed} из ${total} тестов. Общий прогресс: ${percent}%.`,

    tests

  };

}

function getTopicName(topics, item, index) {
    const rawId = item.topic_id ?? item.id ?? (index + 1);
    const idx = Number(rawId) - 1;
    return topics[idx] || topics[index] || `Тема ${rawId}`;
  }

  function hideModal() {
    modal.classList.remove('modal--visible');
    modal.setAttribute('aria-hidden', 'true');
    modalTitle.textContent = '';
    modalSummary.textContent = '';
    modalBody.innerHTML = '';
  }

  function showModal(course) {
    let courseData;

if (course === 'html') {

  courseData =
    createHtmlDetails(accountProgress);

}

else if (course === 'css') {

  courseData =
    createCssDetails(cssProgress);

}

else if (course === 'js') {

  courseData =
    createJsDetails(jsProgress);

}

else if (course === 'ts') {

  courseData =
    createTsDetails(tsProgress);

}

else if (course === 'react') {

  courseData =
    createReactDetails(
      reactProgress
    );

}

else if (course === 'vue') {

  courseData =
    createVueDetails(
      vueProgress
    );

}

else if (course === 'angular') {

  courseData =
    createAngularDetails(
      angularProgress
    );

}

else {

  courseData =
    courseSamples[course];

}


    if (!courseData) {
      return;
    }

    modalTitle.textContent = `${courseData.title} — результаты`;
    modalSummary.textContent = courseData.summary;
    modalBody.innerHTML = '';

    if (courseData.tests && courseData.tests.length) {
      const list = document.createElement('ul');
      list.className = 'modal__list';

      courseData.tests.forEach(item => {
        const listItem = document.createElement('li');
        listItem.className = 'modal__list-item';
        listItem.innerHTML = `<span>${item.name}</span><span>${item.status} · ${item.score}</span>`;
        list.appendChild(listItem);
      });

      modalBody.appendChild(list);
    } else {
      modalBody.innerHTML = '<div class="modal__item"><div class="modal__item-title">Информация</div><div class="modal__item-text">Тут будут отображаться результаты пройденных тестов.</div></div>';
    }

    modal.classList.add('modal--visible');
    modal.setAttribute('aria-hidden', 'false');
  }

  document.querySelectorAll('.skill__label').forEach(button => {
    button.addEventListener('click', () => showModal(button.dataset.course));
    button.addEventListener('keyup', event => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        showModal(button.dataset.course);
      }
    });
  });

  modal.addEventListener('click', event => {
    if (event.target.dataset.close) {
      hideModal();
    }
  });

  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && modal.classList.contains('modal--visible')) {
      hideModal();
    }
  });
})();
